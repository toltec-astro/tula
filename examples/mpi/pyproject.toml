[project]
name = "mpi"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "conan>=2.10",
    "tula-cmake",
]

[tool.uv.sources]
# Within the tula monorepo (examples/mpi/ -> ../../tula_cmake):
tula-cmake = { path = "../../tula_cmake" }
