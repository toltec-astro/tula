[project]
name = "ecsv_reader"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "conan>=2.10",
    "tula-cmake",
]

# tula-cmake source: when running inside the tula repo, the workspace root
# (tula/pyproject.toml) automatically provides tula_cmake/ from the local path.
#
